# A classic three-tier web application on AWS, with provider icons.
theme: aws
size: [14.2, 5.6]
slide:
  title: Web application on AWS
  caption: Static content from the edge; dynamic requests through the load balancer to containers; data in managed services.
elements:
  - card: {id: users, at: [0, 2.2, 1.9, 1.1], icon: aws/users, title: Users, sub: HTTPS}
  - zone: {id: edge, at: [2.4, 0, 2.6, 5.6], label: Edge, color: purple,
           cards: [{id: dns, icon: aws/route-53, title: Route 53, sub: DNS},
                   {id: cdn, icon: aws/cloudfront, title: CloudFront, sub: CDN · TLS},
                   {id: waf, icon: aws/waf, title: AWS WAF, sub: rules · rate limit}]}
  - zone: {id: vpc, at: [5.5, 0, 6.0, 5.6], label: VPC · two availability zones, color: green}
  - card: {id: alb, at: [5.7, 2.2, 2.4, 1.1], icon: aws/elb-application-load-balancer, title: Load balancer, sub: ALB}
  - card: {id: app, at: [8.6, 0.6, 2.7, 1.1], icon: aws/elastic-container-service, title: App containers, sub: ECS · Fargate}
  - card: {id: q, at: [8.6, 2.2, 2.7, 1.1], icon: aws/sqs, title: Job queue, sub: SQS}
  - card: {id: fn, at: [8.6, 3.8, 2.7, 1.1], icon: aws/lambda, title: Workers, sub: Lambda}
  - zone: {id: data, at: [12.0, 0, 2.2, 5.6], label: Data, color: blue,
           cards: [{id: rds, icon: aws/rds, title: RDS, sub: Postgres},
                   {id: cache, icon: aws/elasticache, title: Cache, sub: Redis},
                   {id: s3, icon: aws/simple-storage-service-s3, title: S3, sub: files}]}
  - arrow: {from: users.r, to: cdn.l, color: navy}
  - arrow: {from: dns.b, to: cdn.t, color: purple}
  - arrow: {from: cdn.b, to: waf.t, color: purple}
  - arrow: {from: waf.r, to: alb.l, color: purple}
  - arrow: {from: alb.r, to: app.l, color: green}
  - arrow: {from: app.b, to: q.t, color: orange}
  - arrow: {from: q.b, to: fn.t, color: orange}
  - arrow: {from: app.r, to: rds.l, color: blue}
  - arrow: {from: app.r@0.75, to: cache.l, color: blue, dashed: true}
  - arrow: {from: fn.r, to: s3.l, color: blue}
