  - arrow: {from: hub.b, to: s1.t, both: true, color: navy, route: straight}
  - arrow: {from: hub.b, to: s2.t, both: true, color: navy, route: straight}
  - arrow: {from: hub.b, to: s3.t, both: true, color: navy, route: straight}
